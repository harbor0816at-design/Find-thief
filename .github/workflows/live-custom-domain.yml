name: Live custom-domain HTTPS probe
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'tests/live-custom-domain.sh'
      - '.github/workflows/live-custom-domain.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Verify DNS, HTTPS, app and www redirect
        run: bash tests/live-custom-domain.sh
