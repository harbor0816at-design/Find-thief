name: Refresh public European source metadata V2
on:
  workflow_dispatch:
  schedule:
    - cron: "27 5 * * 4"
  push:
    branches: [main]
    paths:
      - "scripts/collect_public_sources.py"
      - "data/source-targets-v2.json"
      - ".github/workflows/public-sources-v2.yml"
permissions:
  contents: write
jobs:
  public-sources:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python scripts/collect_public_sources.py
      - name: Commit review-only metadata
        run: |
          git add data/source-candidates-v2.json
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "data: update source metadata staging, no incident assertions"
            git push
          fi
