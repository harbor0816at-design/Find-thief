name: Discover European theft news leads
on:
  workflow_dispatch:
  schedule:
    - cron: "13 7 * * 2,5"
  push:
    branches: [main]
    paths:
      - "scripts/collect_media_leads.py"
      - ".github/workflows/media-leads-v21.yml"
permissions:
  contents: write
concurrency:
  group: media-leads-v21
  cancel-in-progress: false
jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 13
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Fetch public news index metadata only
        run: python scripts/collect_media_leads.py
      - name: Commit review-only news URL candidates
        if: success()
        run: |
          git add data/media-leads-v21.json
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "data: refresh European news lead URLs pending source verification"
            git push
          fi
