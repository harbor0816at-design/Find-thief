name: Backend safety tests
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  backend-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Syntax check and unit tests
        run: |
          set -e
          for f in api/*.js app.js guides.js media.js blackout.js enhance.js; do node --check "$f"; done
          node --test tests/*.test.js
          python3 -m py_compile scripts/collect_media_leads.py scripts/collect_public_sources.py scripts/extract_event_candidates.py
          python3 -m unittest discover -s tests -p "test_*.py"
