name: Public source metadata monitor
on:
  schedule:
    - cron: "22 6 * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: public-source-monitor
  cancel-in-progress: false
jobs:
  source-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: true
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - run: python scripts/crawl_public.py
      - name: Commit metadata status only
        run: |
          if ! git diff --quiet -- data/crawl-status.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/crawl-status.json
            git commit -m "chore: refresh public-source metadata checks"
            git push
          fi